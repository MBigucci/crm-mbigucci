<!doctype html>
<html lang="pt-BR" data-theme="auto" data-menu="claro" data-acao="grafite">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f6f5f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Base360">
<link rel="manifest" href="/manifest.webmanifest">
<title>Base360</title>
<!--{{AVISO}}-->
<link rel="icon" type="image/svg+xml" href="{{FAVICON}}">
<link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
<style>
/*{{TOKENS}}*/
/*{{COMPONENTES}}*/
/* Apenas composição: peças e materiais vêm do Alicerce. */
*, *::before, *::after { box-sizing: border-box; }
body { min-height: 100vh; }
.portal { max-width: calc(var(--esp-16) * 13); margin: 0 auto; padding: var(--esp-16) var(--esp-6) var(--esp-10); }
.portal-marca { --portal-marca-tamanho: var(--esp-12); margin: 0; padding: calc(var(--portal-marca-tamanho) / 2) 0; }
.portal-marca .mb-marca { --mb-marca-s: var(--portal-marca-tamanho); }
.portal-intro { margin: var(--esp-8) 0 0; }
.portal-modulos { list-style: none; margin: var(--esp-6) 0 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--esp-4); }
.portal-modulo { height: 100%; display: flex; flex-direction: column; }
.portal-modulo .mb-cartao__corpo { flex: 1; }
.portal-modulo h2 { margin: 0; }
.portal-titulo { display: flex; align-items: center; gap: var(--esp-2); }
.portal-titulo .mb-icone { width: var(--esp-6); height: var(--esp-6); }
.portal-descricao { margin: var(--esp-2) 0 0; color: var(--texto-suave); }
.portal-rodape { margin-top: var(--esp-12); }
.portal-rodape .mb-logo-mbigucci { height: var(--esp-10); }
@media (max-width: 767px) {
  .portal { padding: var(--esp-8) var(--esp-4); }
  .portal-marca { --portal-marca-tamanho: var(--esp-10); }
  .portal-modulos { grid-template-columns: minmax(0, 1fr); }
}
</style>
<script>
/*{{APP}}*/
Base360App.abrirPortal();
Base360App.iniciar().catch(console.warn);
/*{{UTILITARIOS}}*/
MB.preferencias.restaurar();
function atualizarCorPortal() {
  document.querySelector('meta[name="theme-color"]').content = getComputedStyle(document.documentElement).getPropertyValue('--fundo').trim();
}
atualizarCorPortal();
new MutationObserver(atualizarCorPortal).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
</script>
</head>
<body>
<main class="portal">
  <h1 class="portal-marca"><span class="mb-marca" role="img" aria-label="Base360">{{LOCKUP}}</span></h1>
  <p class="leitura portal-intro">Escolha o módulo.</p>
  <ul class="portal-modulos" aria-label="Módulos">
    <li>
      <section class="mb-cartao portal-modulo" aria-labelledby="vendas">
        <div class="mb-cartao__corpo">
          <h2 class="titulo-secao portal-titulo" id="vendas">{{ICONE_VENDAS}}Vendas</h2>
          <p class="corpo portal-descricao">Leads, lista do dia, visitas, vendas e o painel da equipe.</p>
        </div>
        <div class="mb-cartao__rodape">
          <a class="mb-botao mb-botao--primario mb-botao--bloco-celular" href="{{VENDAS}}">Abrir Vendas</a>
        </div>
      </section>
    </li>
    <li>{{REPASSE}}</li>
  </ul>
  <footer class="portal-rodape"><span class="mb-logo-mbigucci"><img src="./mbigucci-logotipo.png" alt="MBigucci"></span></footer>
</main>
</body>
</html>
