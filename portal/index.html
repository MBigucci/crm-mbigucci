/* ---------- Envio de documentos ---------- */
.mb-envio {
  position: relative; display: grid; justify-items: center; gap: var(--esp-1); padding: var(--esp-6) var(--esp-5); text-align: center; cursor: pointer;
  background: var(--campo); border: var(--mb-borda) dashed var(--linha-forte); border-radius: var(--raio-md);
  transition: background-color var(--mb-transicao), border-color var(--mb-transicao);
}
.mb-envio:hover, .mb-envio--arrastando { background: var(--areia-suave); border-color: var(--texto-sutil); }
.mb-envio:focus-within { border-color: var(--foco); box-shadow: 0 0 0 1px var(--foco), var(--sombra-foco); }
.mb-envio > .mb-icone { width: 24px; height: 24px; color: var(--texto-suave); margin-bottom: var(--esp-1); }
.mb-envio__titulo { font-size: 14px; line-height: 20px; font-weight: 600; color: var(--texto); }
.mb-envio__titulo u { text-underline-offset: 3px; }
.mb-envio__ajuda { font-size: 12px; line-height: 16px; color: var(--texto-sutil); }
.mb-envio input[type="file"] { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
.mb-envio__lista { list-style: none; margin: var(--esp-3) 0 0; padding: 0; display: grid; gap: var(--esp-2); }
.mb-envio__item { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: var(--esp-3); padding: var(--esp-2) var(--esp-2) var(--esp-2) var(--esp-3); border: var(--mb-borda) solid var(--linha); border-radius: var(--raio-sm); background: var(--superficie); }
.mb-envio__item > .mb-icone { color: var(--texto-suave); }
.mb-envio__nome { display: grid; min-width: 0; font-size: 13px; line-height: 18px; font-weight: 600; color: var(--texto); }
.mb-envio__nome > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mb-envio__estado { font-size: 12px; line-height: 16px; font-weight: 400; color: var(--texto-sutil); font-variant-numeric: tabular-nums; }
.mb-envio__progresso { height: 4px; margin-top: var(--esp-1); border-radius: var(--raio-total); background: var(--trilho); overflow: hidden; }
.mb-envio__progresso > span { display: block; height: 100%; background: var(--texto); }
.mb-envio__item--erro { border-color: var(--erro); }
.mb-envio__item--erro .mb-envio__estado { color: var(--erro-texto); font-weight: 500; }

/* ---------- Data e hora ---------- */
.mb-campo__par { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--esp-3); }
.mb-campo__par .mb-campo__entrada { min-width: 0; }
.mb-campo__entrada[type="date"], .mb-campo__entrada[type="time"] { font-variant-numeric: tabular-nums; }
.mb-campo__entrada::-webkit-calendar-picker-indicator { cursor: pointer; opacity: 0.7; }
.mb-campo__entrada::-webkit-calendar-picker-indicator:hover { opacity: 1; }
[data-theme="grafite"] .mb-campo__entrada::-webkit-calendar-picker-indicator { filter: invert(1); }

/* ---------- Tabela no celular: rola no próprio quadro com a primeira coluna fixa ---------- */
.mb-tabela--primeira-fixa th:first-child, .mb-tabela--primeira-fixa td:first-child { position: sticky; left: 0; z-index: var(--camada-conteudo); background: var(--superficie); box-shadow: inset -1px 0 0 var(--linha); }
.mb-tabela--primeira-fixa thead th:first-child { z-index: calc(var(--camada-conteudo) + 2); background: var(--superficie-sutil); }

/* ---------- BarraDeAcoes de uma ação só (celular) ---------- */
.mb-barra-acoes--unica { justify-content: stretch; }
.mb-barra-acoes--unica > .mb-botao { flex: 1; }

/* Links dentro de texto: alvo de alvo-minimo (28px) sem mudar o desenho da linha.
   O padding vertical de um elemento em linha aumenta a área de clique e não empurra o texto;
   1.2em é a altura da caixa do texto na Inter. */
.mb-link, .mb-pares a, :is(.mb-resumo__rodape, .mb-faixa__rodape) a, .mb-trilha a, .mb-tabela a.mb-codigo { padding-block: calc((var(--alvo-minimo) - 1.2em) / 2); }

/* Mostrar só no celular ou só no computador (quebra-celular, 768px) */
@media (min-width: 768px) { .mb-so-celular { display: none !important; } }
@media (max-width: 767px) { .mb-so-computador { display: none !important; } }

/* ---------- Celular e toque: abaixo de 768px (quebra-celular) ---------- */
@media (max-width: 767px) {
  .mb-botao, .mb-botao--p, .mb-botao--g, .mb-campo__entrada, .mb-campo__grupo, .mb-filtro, .mb-opcao, .mb-segmentado button,
  .mb-aba, .mb-menu__item, .mb-menu__marca, .mb-conta, .mb-popup__item, .mb-toast__acao, .mb-toast__fechar, .mb-tabela__acoes .mb-botao, .mb-paginacao .mb-botao, :is(.mb-resumo__item, .mb-faixa__item) {
    min-height: var(--controle-toque);
  }
  .mb-botao, .mb-botao--p { height: auto; }
  .mb-botao--icone, .mb-botao--icone.mb-botao--p, .mb-paginacao .mb-botao { width: var(--controle-toque); min-width: var(--controle-toque); }
  .mb-campo__entrada, .mb-campo__grupo { height: var(--controle-toque); font-size: var(--texto-campo-toque); }
  textarea.mb-campo__entrada { height: auto; }
  .mb-campo__grupo .mb-campo__entrada { height: auto; }
  .mb-tabela a.mb-codigo, .mb-tabela td > a { display: inline-flex; align-items: center; min-height: var(--controle-toque); }
  .mb-marcador { min-height: var(--controle-toque); align-items: center; }
  .mb-link { display: inline-flex; align-items: center; min-height: var(--controle-toque); }
  .mb-pares a, :is(.mb-resumo__rodape, .mb-faixa__rodape) a, .mb-trilha a { padding-block: calc((var(--controle-toque) - 1.2em) / 2); }
  .mb-app .mb-topo, .mb-topo { display: none; }
  .mb-lead__nome { padding: calc((var(--controle-toque) - 20px) / 2) 0; margin: calc((20px - var(--controle-toque)) / 2) 0; }
  .mb-app { grid-template-columns: minmax(0, 1fr); }
  .mb-app > .mb-menu { display: none; }
  .mb-celular-topo { display: flex; }
  .mb-app__conteudo { padding: 0 var(--esp-4) var(--esp-8); }
  .mb-barra-acoes { flex-wrap: wrap; gap: var(--esp-3); padding: var(--esp-3) var(--esp-4) var(--esp-4); }
  .mb-barra-acoes > .mb-grupo-botoes { width: 100%; flex-wrap: nowrap; }
  .mb-barra-acoes > .mb-grupo-botoes > .mb-botao { flex: 1; min-width: 0; }
  .mb-barra-acoes--unica .mb-barra-acoes__resumo { display: none; }
  .mb-toast { bottom: calc(var(--controle-toque) + var(--esp-10)); }
  .mb-marca { --mb-marca-s: var(--marca-simbolo-celular); }
}

/* =====================================================================
   Leva 1 — peças gerais (cruzamento Vendas, Repasse e Dashboard, 06/11/2026)
   ===================================================================== */

/* ---------- CardDeItem: o card clicável de qualquer módulo (lead, compromisso, contrato, parceiro) ----------
   O card inteiro abre o registro (o título é um link esticado sobre o card); embaixo, a faixa de ações:
   até duas visíveis e o resto em "Mais". O que é curto (até dois campos) abre dentro do próprio card (.mb-item__edicao). */
.mb-itens { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--esp-3); align-items: start; }
@media (min-width: 1024px) { .mb-itens--duas { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.mb-item {
  position: relative; display: grid; gap: var(--esp-2); align-content: start; box-sizing: border-box; min-width: 0;
  padding: var(--esp-4) var(--esp-5) 0;
  background: var(--superficie); border: var(--mb-borda) solid var(--linha); border-radius: var(--raio-md); box-shadow: var(--sombra-cartao);
  transition: box-shadow var(--mov-cartao) var(--mov-curva), transform var(--mov-cartao) var(--mov-curva), border-color var(--mov-cartao) var(--mov-curva);
}
.mb-item--sem-faixa { padding-bottom: var(--esp-4); }
/* O primeiro card da tela (o que pede ação agora): só a sombra do site, sem barra e sem cor */
.mb-item--destaque { box-shadow: var(--sombra-elegante); }
@media (hover: hover) { .mb-item:has(.mb-item__alvo):hover { box-shadow: var(--sombra-elegante); transform: translateY(var(--mov-elevacao)); border-color: var(--linha-forte); } }
/* Com um popup (Mais, Compartilhar) aberto, o card fica por cima dos vizinhos */
.mb-item:has([aria-expanded="true"]) { z-index: var(--camada-popup); }
.mb-item:has(.mb-item__edicao:not([hidden])) { transform: none; }
.mb-item__cabeca { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--esp-3); }
.mb-item__id { display: grid; gap: 2px; min-width: 0; flex: 1; }
.mb-item__titulo {
  display: block; margin: 0; color: var(--texto); text-decoration: none; font-family: var(--font-display); font-size: 17px; line-height: 20px; font-weight: 700; letter-spacing: -0.01em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums;
}
/* Link esticado: o card inteiro abre o registro; o foco desenha o anel no card */
.mb-item__alvo { color: inherit; text-decoration: none; }
.mb-item__alvo::after { content: ""; position: absolute; inset: 0; z-index: var(--camada-conteudo); border-radius: inherit; }
.mb-item__alvo:hover { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
.mb-item__alvo:focus-visible { outline: none; }
.mb-item:has(.mb-item__alvo:focus-visible) { outline: var(--mb-foco-espessura) solid var(--foco); outline-offset: var(--mb-foco-afastamento); }
/* Tudo que se toca dentro do card fica acima do link esticado */
.mb-item :is(a, button, input, select, textarea, label, .mb-ancora):not(.mb-item__alvo) { position: relative; z-index: calc(var(--camada-conteudo) + 1); }
.mb-item__linha { display: block; font-size: 14px; line-height: 20px; color: var(--texto-suave); font-variant-numeric: tabular-nums; }
.mb-item__linha--forte { font-size: 15px; font-weight: 700; color: var(--texto); }
.mb-item__texto {
  margin: 0; font-size: 13px; line-height: 18px; color: var(--texto-suave);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.mb-item__rodape { display: flex; align-items: center; gap: var(--esp-2); flex-wrap: wrap; }
/* A faixa de ações é o rodapé do Cartao (mesmo fundo quase branco, fio, raio e respiro): o CardDeItem é um Cartao de uma seção, clicável.
   Ordem: no máximo duas ações, a principal por último. Sem menu ⋯ no card: o que é crítico ou raro fica no registro aberto.
   Peso pela frequência: uma ação cheia; a segunda com borda se for de uso diário, sem borda se for eventual. */
.mb-item__faixa, .mb-item__edicao {
  position: relative; z-index: calc(var(--camada-conteudo) + 1);
  margin: var(--esp-2) calc(-1 * var(--esp-5)) 0; border-top: var(--mb-borda) solid var(--linha); background: var(--superficie-sutil);
  border-radius: 0 0 calc(var(--raio-md) - var(--mb-borda)) calc(var(--raio-md) - var(--mb-borda));
}
.mb-item__faixa { display: flex; align-items: center; justify-content: flex-end; gap: var(--esp-2); padding: var(--esp-3) var(--esp-5); }
.mb-item > * { min-width: 0; }
.mb-item__faixa > .mb-ancora { flex: none; }
.mb-item__edicao { display: grid; gap: var(--esp-3); padding: var(--esp-4) var(--esp-5); animation: mb-aparece var(--mov-base) var(--mov-curva) both; }
.mb-item__edicao[hidden], .mb-item__faixa[hidden] { display: none; }
.mb-item__edicao-titulo { margin: 0; font-size: 14px; line-height: 20px; font-weight: 600; color: var(--texto); }

/* ---------- Chip sem classificação (todo chip tem cor; a ausência é areia com o sinal "–") ---------- */
.mb-chip--sem { background: var(--areia); color: var(--texto-suave); --mb-selo-lead-sinal: var(--texto-suave); }

/* ---------- Prazo: texto colorido com sinal (nunca só a cor) ----------
   Um só para todos os prazos: 15 min do primeiro contato, sem contato há N dias, 90 dias do parceiro, SLA em dias úteis, prazo legal. */
.mb-prazo { font-weight: 600; color: var(--texto-suave); font-variant-numeric: tabular-nums; }
.mb-prazo--atencao { color: var(--alerta-texto); }
.mb-prazo--estourado { color: var(--erro-texto); font-weight: 700; }

/* ---------- Lista: uma lista só para pendências, agenda e itens de trabalho ---------- */
.mb-lista--cartao { background: var(--superficie); border: var(--mb-borda) solid var(--linha); border-radius: var(--raio-md); box-shadow: var(--sombra-cartao); overflow: hidden; }
.mb-lista__item { position: relative; }
.mb-lista__hora { flex: none; min-width: 48px; font-size: 15px; line-height: 20px; font-weight: 700; color: var(--texto); font-variant-numeric: tabular-nums; }
.mb-lista__alvo { color: inherit; text-decoration: none; }
.mb-lista__alvo::after { content: ""; position: absolute; inset: 0; z-index: var(--camada-conteudo); }
.mb-lista__alvo:focus-visible { outline: none; }
.mb-lista__item:has(.mb-lista__alvo:focus-visible) { outline: var(--mb-foco-espessura) solid var(--foco); outline-offset: calc(-1 * var(--mb-foco-espessura)); }
.mb-lista__item :is(a, button):not(.mb-lista__alvo) { position: relative; z-index: calc(var(--camada-conteudo) + 1); }
.mb-lista__grupo { margin: 0; padding: var(--esp-3) var(--esp-4) var(--esp-1); font-size: 11px; line-height: 16px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--texto-sutil); }

/* ---------- Painel lateral (computador) = folha que sobe (celular) ----------
   Para toda tarefa com mais de dois campos: registrar, mensagem pronta, cadastro, relatório de um número.
   A lista fica parada atrás; fecha com Esc, com o véu ou com o X, e o foco volta a quem abriu. */
.mb-lateral__veu {
  position: fixed; inset: 0; z-index: calc(var(--camada-painel) - 1); background: var(--veu);
  opacity: 0; visibility: hidden; transition: opacity var(--mb-transicao-base), visibility 0s linear var(--mov-base);
}
.mb-lateral {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: var(--camada-painel); display: flex; flex-direction: column; box-sizing: border-box;
  width: min(var(--painel-largura), 100vw); background: var(--superficie); color: var(--texto);
  border-left: var(--mb-borda) solid var(--linha); box-shadow: var(--sombra-flutuante);
  transform: translateX(102%); visibility: hidden;
  transition: transform var(--mov-entrada) var(--mov-curva), visibility 0s linear var(--mov-entrada);
}
.mb-lateral--larga { width: min(var(--painel-largura-larga), 100vw); }
.mb-lateral--aberto { transform: none; visibility: visible; transition: transform var(--mov-entrada) var(--mov-curva), visibility 0s; }
.mb-lateral--aberto + .mb-lateral__veu { opacity: 1; visibility: visible; transition: opacity var(--mb-transicao-base), visibility 0s; }
.mb-lateral__alca { display: none; }
.mb-lateral__topo { display: flex; align-items: flex-start; gap: var(--esp-3); padding: var(--esp-5) var(--esp-4) var(--esp-4) var(--esp-5); border-bottom: var(--mb-borda) solid var(--linha); }
.mb-lateral__titulos { display: grid; gap: 2px; flex: 1; min-width: 0; }
.mb-lateral__titulo { margin: 0; font-family: var(--font-display); font-size: 18px; line-height: 22px; font-weight: 700; letter-spacing: -0.01em; color: var(--texto); }
.mb-lateral__descricao { margin: 0; font-size: 13px; line-height: 18px; color: var(--texto-sutil); }
.mb-lateral__corpo { flex: 1; min-height: 0; overflow-y: auto; display: grid; gap: var(--esp-5); align-content: start; padding: var(--esp-5); }
.mb-lateral__rodape { display: flex; align-items: center; justify-content: flex-end; gap: var(--esp-3); padding: var(--esp-3) var(--esp-5); border-top: var(--mb-borda) solid var(--linha); background: var(--superficie); }
/* Para documentação: o painel desenhado dentro da página, sem flutuar */
.mb-lateral--estatico { position: relative; inset: auto; transform: none; visibility: visible; transition: none; height: 100%; }

/* ---------- Ícone de menu (o mesmo do site mbigucci.com.br): três traços que viram X ---------- */
.mb-menu-icone {
  position: relative; flex: none; display: inline-grid; place-content: center; width: var(--controle-toque); height: var(--controle-toque); padding: 0;
  border: 0; border-radius: var(--raio-sm); background: transparent; color: var(--texto); cursor: pointer;
  transition: background-color var(--mb-transicao);
}
.mb-menu-icone:hover { background: var(--areia-suave); }
.mb-menu-icone--p { width: 36px; height: 36px; color: var(--texto-suave); }
.mb-menu-icone__barras { position: relative; display: block; width: 24px; height: 16px; }
.mb-menu-icone--p .mb-menu-icone__barras { width: 20px; height: 14px; }
.mb-menu-icone__barras > span {
  position: absolute; left: 0; height: 2px; border-radius: 1px; background: currentColor;
  transition: transform var(--mb-transicao-base), opacity var(--mb-transicao-base), top var(--mb-transicao-base);
}
.mb-menu-icone__barras > span:nth-child(1) { top: 0; width: 100%; }
.mb-menu-icone__barras > span:nth-child(2) { top: calc(50% - 1px); width: 66.67%; transform-origin: left center; }
.mb-menu-icone__barras > span:nth-child(3) { top: calc(100% - 2px); width: 100%; }
.mb-menu-icone[aria-expanded="true"] .mb-menu-icone__barras > span:nth-child(1) { top: calc(50% - 1px); transform: rotate(45deg); }
.mb-menu-icone[aria-expanded="true"] .mb-menu-icone__barras > span:nth-child(2) { opacity: 0; transform: scaleX(0); }
.mb-menu-icone[aria-expanded="true"] .mb-menu-icone__barras > span:nth-child(3) { top: calc(50% - 1px); transform: rotate(-45deg); }
:is(.mb-menu--escuro, [data-menu="escuro"] .mb-menu, .mb-folha--escuro, [data-menu="escuro"] .mb-folha) .mb-menu-icone { color: var(--sobre-menu-suave); }
:is(.mb-menu--escuro, [data-menu="escuro"] .mb-menu, .mb-folha--escuro, [data-menu="escuro"] .mb-folha) .mb-menu-icone:hover { background: var(--menu-hover); color: var(--sobre-menu); }
/* Cabeçalho do celular: o lockup à esquerda; à direita o "+" do módulo (sempre em acao) e o ícone de menu, na ponta.
   Na folha, o mesmo ícone em X fica exatamente no mesmo lugar. */
.mb-celular-topo:has(> .mb-menu-icone) { gap: var(--esp-2); padding: 0 var(--esp-2) 0 var(--esp-4); }
.mb-celular-topo > a.mb-botao { margin-right: 0; }
.mb-folha:has(> .mb-folha__topo .mb-menu-icone) { padding-top: 0; }
.mb-folha__topo:has(.mb-menu-icone) { min-height: calc(var(--controle-toque) + var(--esp-4)); padding: 0 0 var(--esp-1) var(--esp-1); margin-right: calc(-1 * var(--esp-1)); }
/* Faixa de status do módulo, logo abaixo do cabeçalho (só no celular) */
.mb-celular-status {
  display: none; position: sticky; top: calc(var(--controle-toque) + var(--esp-4)); z-index: var(--camada-topo); align-items: center; justify-content: space-between; gap: var(--esp-3);
  min-height: 36px; padding: 0 var(--esp-2) 0 var(--esp-4); box-sizing: border-box;
  background: var(--superficie-sutil); border-bottom: var(--mb-borda) solid var(--linha); font-size: 13px; line-height: 18px;
}

/* ---------- Status do módulo (na barra superior; no celular, na faixa) ----------
   Um botão neutro com sinal + palavra: "✓ Recebendo · 3º na fila", "! Faça check-in", "– Pausa até 12/11". */
.mb-status {
  --mb-status-tom: var(--texto-sutil);
  display: inline-flex; align-items: center; gap: 6px; min-height: var(--controle-p); padding: 0 var(--esp-3); box-sizing: border-box;
  border: var(--mb-borda) solid transparent; border-radius: var(--raio-total); background: var(--areia); color: var(--texto-suave);
  font-family: var(--font-sans); font-size: 13px; line-height: 18px; font-weight: 600; white-space: nowrap; cursor: pointer; text-decoration: none;
  transition: border-color var(--mb-transicao), background-color var(--mb-transicao);
}
.mb-status:hover { border-color: var(--mb-status-tom); }
.mb-status__sinal { font-weight: 800; }
.mb-status--ok { background: var(--sucesso-fundo); color: var(--sucesso-texto); --mb-status-tom: var(--sucesso); }
.mb-status--atencao { background: var(--alerta-fundo); color: var(--alerta-texto); --mb-status-tom: var(--alerta); }
.mb-status--info { background: var(--info-fundo); color: var(--info-texto); --mb-status-tom: var(--info); }
.mb-status__detalhe { font-weight: 500; font-variant-numeric: tabular-nums; }
.mb-celular-status .mb-status { min-height: 28px; padding: 0 10px; font-size: 12px; line-height: 16px; }

/* ---------- Menu lateral recolhível (só os ícones, com dica) e atalhos externos ----------
   "Recolher menu" é o primeiro item do rodapé, com o desenho do ícone de menu do site (três traços, o do meio menor). */
.mb-menu__recolher { width: 100%; border: 0; background: none; cursor: pointer; font-family: var(--font-sans); text-align: left; }
:is(.mb-app--recolhido, :where(:root[data-menu-recolhido="sim"]) .mb-app) .mb-menu__item[aria-current="page"]::after { right: 3px; }
:is(.mb-app--recolhido, :where(:root[data-menu-recolhido="sim"]) .mb-app) .mb-menu__rotulo {
  position: absolute; left: calc(100% + var(--esp-2)); top: 50%; z-index: var(--camada-popup); width: max-content; max-width: 220px;
  padding: 6px var(--esp-2); border-radius: var(--raio-sm); background: var(--texto); color: var(--superficie); box-shadow: var(--sombra-flutuante);
  font-size: 12px; line-height: 16px; font-weight: 500; pointer-events: none;
  opacity: 0; visibility: hidden; transform: translate(calc(-1 * var(--esp-1)), -50%);
  transition: opacity var(--mb-transicao-base), transform var(--mb-transicao-base), visibility 0s linear var(--mov-base);
}
:is(.mb-app--recolhido, :where(:root[data-menu-recolhido="sim"]) .mb-app) .mb-menu__item:is(:hover, :focus-visible) .mb-menu__rotulo { opacity: 1; visibility: visible; transform: translate(0, -50%); transition-delay: 0s; }
.mb-menu__externo { margin-left: auto; color: var(--texto-sutil); }
:is(.mb-app--recolhido, :where(:root[data-menu-recolhido="sim"]) .mb-app) .mb-menu__externo { display: none; }

/* ---------- Interruptor (ligar e desligar; seleção = tinta) ---------- */
.mb-interruptor {
  display: inline-flex; align-items: center; gap: var(--esp-3); min-height: var(--controle-m); padding: 0; border: 0; background: none; cursor: pointer;
  font-family: var(--font-sans); font-size: 14px; line-height: 20px; font-weight: 500; color: var(--texto); text-align: left;
}
.mb-interruptor__trilho { position: relative; flex: none; width: 36px; height: 20px; border-radius: var(--raio-total); background: var(--trilho); transition: background-color var(--mb-transicao-base); }
.mb-interruptor__trilho::after {
  content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: var(--raio-total);
  background: var(--superficie); box-shadow: var(--sombra-campo); transition: transform var(--mb-transicao-base);
}
.mb-interruptor[aria-checked="true"] .mb-interruptor__trilho { background: var(--texto); }
.mb-interruptor[aria-checked="true"] .mb-interruptor__trilho::after { transform: translateX(16px); }
.mb-interruptor__estado { font-size: 12px; line-height: 16px; color: var(--texto-sutil); min-width: 7ch; }
.mb-interruptor:disabled { opacity: var(--mb-opacidade-desativado); cursor: not-allowed; }

/* ---------- Seção recolhível (details) e "Ver todos" ---------- */
.mb-recolhivel > summary {
  display: flex; align-items: center; gap: var(--esp-2); min-height: var(--controle-m); list-style: none; cursor: pointer;
  font-size: 14px; line-height: 20px; font-weight: 600; color: var(--texto); border-radius: var(--raio-sm);
}
.mb-recolhivel > summary::-webkit-details-marker { display: none; }
.mb-recolhivel > summary::before {
  content: ""; flex: none; width: 7px; height: 7px; margin: 0 var(--esp-1) 0 2px; border-right: 1.75px solid var(--texto-suave); border-bottom: 1.75px solid var(--texto-suave);
  transform: rotate(-45deg); transition: transform var(--mb-transicao);
}
.mb-recolhivel[open] > summary::before { transform: rotate(45deg); }
.mb-recolhivel__contagem { font-weight: 500; color: var(--texto-sutil); font-variant-numeric: tabular-nums; }
.mb-recolhivel__corpo { display: grid; gap: var(--esp-3); padding: var(--esp-2) 0 var(--esp-3) calc(var(--esp-2) + 11px); }
.mb-cartao__corpo > .mb-recolhivel + .mb-recolhivel { border-top: var(--mb-borda) solid var(--linha); }

/* ---------- Navegador de período e semana com 7 dias ---------- */
.mb-periodo { display: flex; align-items: center; gap: var(--esp-2); flex-wrap: wrap; }
.mb-periodo__rotulo { min-width: 0; padding: 0 var(--esp-2); font-family: var(--font-display); font-size: 16px; line-height: 20px; font-weight: 700; color: var(--texto); text-align: center; font-variant-numeric: tabular-nums; }
.mb-periodo__hoje { margin-left: var(--esp-2); }
.mb-semana { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: var(--esp-1); }
.mb-semana__dia {
  display: grid; justify-items: center; align-content: center; gap: 0; min-height: 60px; min-width: 0; padding: var(--esp-1) 0; box-sizing: border-box;
  border: var(--mb-borda) solid var(--linha); border-radius: var(--raio-sm); background: var(--superficie); color: var(--texto-suave); cursor: pointer;
  font-family: var(--font-sans); transition: background-color var(--mb-transicao), border-color var(--mb-transicao), color var(--mb-transicao);
}
.mb-semana__dia:hover { border-color: var(--texto); }
.mb-semana__nome { font-size: 11px; line-height: 14px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; }
.mb-semana__numero { font-family: var(--font-display); font-size: 17px; line-height: 22px; font-weight: 700; color: var(--texto); font-variant-numeric: tabular-nums; }
.mb-semana__contagem { font-size: 11px; line-height: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
/* Hoje: contorno em tinta e um traço embaixo do número (sem vermelho: o vermelho é do logo, do menu e da ação) */
.mb-semana__dia--hoje { border-color: var(--texto); box-shadow: inset 0 -3px 0 var(--texto); }
.mb-semana__dia[aria-pressed="true"] { background: var(--texto); border-color: var(--texto); color: var(--superficie); }
.mb-semana__dia[aria-pressed="true"] .mb-semana__numero { color: var(--superficie); }
.mb-semana__dia--hoje[aria-pressed="true"] { box-shadow: inset 0 -3px 0 var(--superficie); }

/* ---------- Dados ao vivo: conexão, última atualização e "Atualizar agora" ---------- */
.mb-ao-vivo { display: inline-flex; align-items: center; gap: var(--esp-2); flex-wrap: wrap; font-size: 12px; line-height: 16px; color: var(--texto-sutil); font-variant-numeric: tabular-nums; }
.mb-ao-vivo__ponto { flex: none; width: 8px; height: 8px; border-radius: var(--raio-total); background: var(--sucesso); }
.mb-ao-vivo__estado { font-weight: 600; color: var(--texto); }
.mb-ao-vivo--sem-conexao .mb-ao-vivo__ponto { background: var(--alerta); }
.mb-ao-vivo--parado .mb-ao-vivo__ponto { background: var(--texto-sutil); }

/* ---------- Leva 1 no celular ---------- */
@media (max-width: 767px) {
  .mb-celular-status { display: flex; }
  .mb-celular-status .mb-botao { min-height: 36px; }
  .mb-item { padding-left: var(--esp-4); padding-right: var(--esp-4); }
  .mb-item__faixa, .mb-item__edicao { margin-left: calc(-1 * var(--esp-4)); margin-right: calc(-1 * var(--esp-4)); padding-left: var(--esp-4); padding-right: var(--esp-4); }
  .mb-item__faixa > .mb-ancora > .mb-botao { width: var(--controle-toque); }
  /* No celular as ações do rodapé (do card e do cartão) ocupam a largura, para o polegar */
  .mb-item__faixa > .mb-botao, .mb-cartao__rodape > .mb-botao { flex: 1; min-width: 0; padding: 0 var(--esp-2); }
  .mb-toast__fechar { width: var(--controle-toque); }
  .mb-interruptor, .mb-status, .mb-recolhivel > summary { min-height: var(--controle-toque); }
  .mb-lateral, .mb-lateral--larga {
    top: auto; left: 0; right: 0; bottom: 0; width: auto; max-height: 92dvh;
    border-left: 0; border-top: var(--mb-borda) solid var(--linha); border-radius: var(--raio-lg) var(--raio-lg) 0 0;
    transform: translateY(102%);
  }
  .mb-lateral--aberto { transform: none; }
  .mb-lateral--estatico { transform: none; }
  .mb-lateral__alca { display: block; flex: none; width: 36px; height: 4px; margin: var(--esp-2) auto 0; border-radius: var(--raio-total); background: var(--linha-forte); }
  .mb-lateral__topo { padding: var(--esp-2) var(--esp-2) var(--esp-3) var(--esp-4); }
  .mb-lateral__corpo { padding: var(--esp-4); }
  .mb-lateral__rodape { padding: var(--esp-3) var(--esp-4) calc(var(--esp-3) + env(safe-area-inset-bottom)); }
  .mb-lateral__rodape > .mb-botao { flex: 1; min-width: 0; }
  .mb-periodo { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; }
  .mb-periodo__hoje { grid-column: 1 / -1; justify-self: center; margin-left: 0; }
  .mb-semana__nome { font-size: 11px; letter-spacing: 0.02em; }
}

/* ---------- Leva 1 na impressão ---------- */
@media print {
  .mb-lateral, .mb-lateral__veu, .mb-item__faixa, .mb-item__edicao, .mb-celular-status, .mb-menu-icone, .mb-status, .mb-ao-vivo button { display: none !important; }
  .mb-item { box-shadow: none !important; border: 1pt solid #000000; break-inside: avoid; padding-bottom: var(--esp-4); }
  .mb-prazo { color: #000000 !important; }
  .mb-chip--sem { background: none !important; color: #000000 !important; border: 1pt solid #000000; }
}

/* =====================================================================
   Leva 2 — dados e formulários (06/11/2026)
   ===================================================================== */

/* ---------- Tabela completa: ordenar, abrir pela linha, marcar em lote, editar na linha ---------- */
.mb-tabela__ordenar {
  display: inline-flex; align-items: center; gap: 4px; margin: 0; padding: 0; border: 0; background: none; cursor: pointer;
  font: inherit; letter-spacing: inherit; text-transform: inherit; color: inherit;
}
.mb-tabela__ordenar::after { content: "↕"; font-size: 11px; opacity: 0.45; letter-spacing: 0; }
.mb-tabela th[aria-sort="ascending"] .mb-tabela__ordenar, .mb-tabela th[aria-sort="descending"] .mb-tabela__ordenar { color: var(--texto); }
.mb-tabela th[aria-sort="ascending"] .mb-tabela__ordenar::after { content: "↑"; opacity: 1; }
.mb-tabela th[aria-sort="descending"] .mb-tabela__ordenar::after { content: "↓"; opacity: 1; }
/* A linha inteira abre o registro: o código (ou o nome) na primeira coluna é o link esticado */
.mb-tabela--linhas tbody tr { position: relative; }
.mb-tabela--linhas tbody tr:hover td { cursor: pointer; }
.mb-tabela__alvo::after { content: ""; position: absolute; inset: 0; z-index: var(--camada-conteudo); }
.mb-tabela--linhas tbody :is(button, input, select, label, .mb-ancora, a:not(.mb-tabela__alvo)) { position: relative; z-index: calc(var(--camada-conteudo) + 1); }
.mb-tabela__marcar { width: 1%; padding-right: 0 !important; }
.mb-tabela__marcar .mb-marcador { vertical-align: middle; }
/* Selos na linha: até três, numa linha só */
.mb-tabela__selos { display: flex; flex-wrap: nowrap; gap: var(--esp-1); }
/* Linha Total ou Equipe */
.mb-tabela tfoot td.mb-tabela__num { font-variant-numeric: tabular-nums lining-nums; }
/* Edição na linha: valor + Salvar + estado, sem sair da tabela */
.mb-tabela__editar { display: flex; align-items: center; justify-content: flex-end; gap: var(--esp-2); }
.mb-tabela__editar .mb-campo__grupo, .mb-tabela__editar .mb-campo__entrada { height: 28px; font-size: 13px; }
.mb-tabela__editar .mb-campo__grupo { width: 150px; }
.mb-tabela__editar .mb-botao { height: 28px; padding: 0 var(--esp-2); font-size: 12px; }
/* Escondido sem sair do lugar: os campos de todas as linhas ficam alinhados */
.mb-tabela__editar .mb-botao[hidden] { display: inline-flex; visibility: hidden; }
/* Mudou e ainda não salvou: o campo ganha a borda em tinta até salvar */
.mb-tabela__editar--mudou .mb-campo__grupo { border-color: var(--texto); }
/* Estado de gravação: em células, formulários e cartões */
.mb-salvo { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; line-height: 16px; font-weight: 500; color: var(--texto-sutil); white-space: nowrap; font-variant-numeric: tabular-nums; }
.mb-salvo--ok { color: var(--sucesso-texto); }
.mb-salvo--erro { color: var(--erro-texto); }

/* Barra de seleção em lote: aparece quando algo está marcado; fica presa embaixo da área */
.mb-lote {
  position: sticky; bottom: var(--esp-4); z-index: var(--camada-fixo); display: flex; align-items: center; gap: var(--esp-3); flex-wrap: wrap;
  margin: var(--esp-3) auto 0; width: max-content; max-width: 100%; box-sizing: border-box;
  padding: var(--esp-2) var(--esp-2) var(--esp-2) var(--esp-4); border: var(--mb-borda) solid var(--linha); border-radius: var(--raio-md);
  background: var(--superficie); box-shadow: var(--sombra-flutuante); font-size: 14px; line-height: 20px; font-weight: 600; color: var(--texto);
}
.mb-lote[hidden] { display: none; }
.mb-lote__contagem { font-variant-numeric: tabular-nums; }

/* Tabela no celular, conforme o tipo (abaixo de 768px)
   --registros: cada linha vira um card (sem escrever a lista à mão); o rótulo vem de data-rotulo.
   --numeros: rola dentro do quadro com a primeira coluna e a linha Total fixas. */
@media (max-width: 767px) {
  .mb-tabela--registros thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .mb-tabela--registros, .mb-tabela--registros tbody { display: block; }
  .mb-tabela-envoltorio:has(> .mb-tabela--registros) { border: 0; background: none; box-shadow: none; overflow: visible; }
  .mb-tabela--registros tbody tr {
    display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--esp-1) var(--esp-3); margin-bottom: var(--esp-3); padding: var(--esp-3) var(--esp-4);
    background: var(--superficie); border: var(--mb-borda) solid var(--linha); border-radius: var(--raio-md); box-shadow: var(--sombra-cartao);
  }
  .mb-tabela--registros td { display: flex; justify-content: space-between; gap: var(--esp-3); height: auto; padding: 0 !important; border: 0; grid-column: 1 / -1; font-size: 14px; line-height: 20px; }
  .mb-tabela--registros td[data-rotulo]::before { content: attr(data-rotulo); color: var(--texto-sutil); font-size: 13px; }
  .mb-tabela--registros td:is(:first-child:not(.mb-tabela__marcar), .mb-tabela__marcar + td) { grid-column: 1; grid-row: 1; font-weight: 600; }
  .mb-tabela--registros td.mb-tabela__marcar { grid-column: 2; grid-row: 1; justify-content: flex-end; }
  .mb-tabela--registros td.mb-tabela__acoes { width: auto; justify-content: flex-end; padding-top: var(--esp-2) !important; }
  .mb-tabela--registros tbody tr td, .mb-tabela--registros tbody tr:hover td, .mb-tabela--registros tbody tr[aria-selected="true"] td { background: none; }
  /* Marcado: o card inteiro ganha o contorno em tinta e o fundo de seleção — nunca faixas por célula */
  .mb-tabela--registros tbody tr[aria-selected="true"] { border-color: var(--texto); box-shadow: 0 0 0 1px var(--texto), var(--sombra-cartao); background: var(--areia-suave); }
  .mb-tabela--registros td:is(:first-child:not(.mb-tabela__marcar), .mb-tabela__marcar + td) a.mb-codigo { min-height: 0; padding-block: calc((var(--controle-toque) - 18px) / 2); margin-block: calc((18px - var(--controle-toque)) / 2); }
  .mb-tabela--registros tfoot { display: none; }
  .mb-tabela--numeros tfoot td { position: sticky; bottom: 0; }
  .mb-tabela__editar .mb-campo__grupo { width: 120px; }
}

/* ---------- Barra de filtros (filtros e busca ficam no endereço da página) ---------- */
.mb-filtros { display: flex; flex-wrap: wrap; align-items: flex-end; gap: var(--esp-3); }
.mb-filtros > .mb-campo { flex: 0 1 190px; min-width: 150px; }
.mb-filtros > .mb-filtros__busca { flex: 1 1 260px; }
.mb-filtros__ativos { display: flex; flex-wrap: wrap; align-items: center; gap: var(--esp-2); width: 100%; font-size: 12px; line-height: 16px; color: var(--texto-sutil); }
.mb-filtros__ativos .mb-opcao::after { content: "✕"; font-size: 11px; margin-left: 2px; }
.mb-filtros__celular { display: none; }
/* Escopo: de quem são os dados que a tela mostra */
.mb-escopo { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; line-height: 16px; font-weight: 600; color: var(--texto-suave); }
.mb-escopo::before { content: ""; width: 6px; height: 6px; border-radius: var(--raio-total); background: var(--texto-sutil); }
@media (max-width: 767px) {
  .mb-filtros > .mb-campo:not(.mb-filtros__busca) { display: none; }
  .mb-filtros > .mb-filtros__busca { flex-basis: 100%; }
  .mb-filtros__celular { display: inline-flex; }
}

/* ---------- Gráficos (barras em HTML, linha em SVG) ----------
   Cores de série só aqui: grafico-1 a 5, "Outros" e "Não informado" em grafico-outros. O valor está sempre escrito. */
.mb-grafico { display: grid; gap: var(--esp-4); }
.mb-grafico__topo { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--esp-3); flex-wrap: wrap; }
.mb-grafico__titulo { margin: 0; font-family: var(--font-display); font-size: 16px; line-height: 20px; font-weight: 700; color: var(--texto); }
.mb-grafico__nota { margin: 2px 0 0; font-size: 12px; line-height: 16px; color: var(--texto-sutil); }
.mb-serie-1 { --mb-serie: var(--grafico-1); } .mb-serie-2 { --mb-serie: var(--grafico-2); } .mb-serie-3 { --mb-serie: var(--grafico-3); }
.mb-serie-4 { --mb-serie: var(--grafico-4); } .mb-serie-5 { --mb-serie: var(--grafico-5); } .mb-serie-outros { --mb-serie: var(--grafico-outros); }
.mb-legenda { display: flex; flex-wrap: wrap; gap: var(--esp-1) var(--esp-4); margin: 0; padding: 0; list-style: none; font-size: 12px; line-height: 16px; color: var(--texto-suave); }
.mb-legenda li { display: inline-flex; align-items: center; gap: 6px; }
.mb-legenda li::before { content: ""; width: 10px; height: 10px; border-radius: 2px; background: var(--mb-serie, var(--texto)); }
/* Barras horizontais: rótulo · trilho · valor */
.mb-barras { display: grid; gap: var(--esp-2); margin: 0; padding: 0; list-style: none; }
.mb-barras--rolagem { max-height: 340px; overflow-y: auto; padding-right: var(--esp-2); }
.mb-barras__linha { display: grid; grid-template-columns: minmax(0, 150px) minmax(0, 1fr) minmax(56px, auto); align-items: center; gap: var(--esp-3); font-size: 13px; line-height: 18px; }
.mb-barras__rotulo { color: var(--texto); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mb-barras__valor { text-align: right; font-weight: 600; color: var(--texto); font-variant-numeric: tabular-nums; white-space: nowrap; }
.mb-barras__valor small { font-size: 11px; font-weight: 500; color: var(--texto-sutil); }
.mb-barras__trilho { display: flex; align-items: center; height: 14px; min-width: 0; }
.mb-barras__seg { height: 100%; width: var(--v, 0%); background: var(--mb-serie, var(--texto)); flex: none; }
.mb-barras__seg:first-child { border-radius: 2px 0 0 2px; } .mb-barras__seg:last-child { border-radius: 0 2px 2px 0; }
.mb-barras__seg:only-child { border-radius: 2px; }
.mb-barras__seg + .mb-barras__seg { box-shadow: inset 1px 0 0 var(--superficie); }
/* Agrupadas: uma barra fina por série, empilhadas na vertical */
.mb-barras--agrupadas .mb-barras__trilho { flex-direction: column; align-items: stretch; justify-content: center; gap: 2px; height: auto; }
.mb-barras--agrupadas .mb-barras__seg { height: 7px; border-radius: 0 2px 2px 0; }
/* Divergentes: zero no meio, negativo à esquerda, positivo à direita */
.mb-barras--divergente .mb-barras__trilho { display: grid; grid-template-columns: 1fr 1fr; height: 14px; }
.mb-barras--divergente .mb-barras__trilho > span { display: flex; height: 100%; }
.mb-barras--divergente .mb-barras__trilho > span:first-child { justify-content: flex-end; border-right: var(--mb-borda) solid var(--texto-sutil); }
.mb-barras__neg { height: 100%; width: var(--v); background: var(--grafico-negativo); border-radius: 2px 0 0 2px; }
.mb-barras__pos { height: 100%; width: var(--v); background: var(--grafico-positivo); border-radius: 0 2px 2px 0; }
.mb-barras__valor--neg { color: var(--grafico-negativo); }
/* Colunas (barras verticais) */
.mb-colunas { display: flex; align-items: flex-end; gap: var(--esp-2); height: 180px; margin: 0; padding: 0 0 var(--esp-1); list-style: none; border-bottom: var(--mb-borda) solid var(--linha-forte); }
.mb-colunas__item { flex: 1; min-width: 0; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; }
.mb-colunas__valor { font-size: 11px; line-height: 14px; font-weight: 600; color: var(--texto); font-variant-numeric: tabular-nums; }
.mb-colunas__barra { width: min(32px, 70%); height: var(--v, 0%); background: var(--mb-serie, var(--texto)); border-radius: 2px 2px 0 0; }
.mb-colunas__rotulos { display: flex; gap: var(--esp-2); margin: var(--esp-1) 0 0; padding: 0; list-style: none; }
.mb-colunas__rotulos li { flex: 1; min-width: 0; text-align: center; font-size: 11px; line-height: 14px; color: var(--texto-sutil); }
/* Linha (SVG): eixo e grade em linha, a série em --mb-serie */
.mb-svg-grafico { display: block; width: 100%; height: auto; overflow: visible; }
.mb-svg-grafico .mb-svg-grade { stroke: var(--linha); stroke-width: 1; }
.mb-svg-grafico .mb-svg-serie { fill: none; stroke: var(--mb-serie, var(--texto)); stroke-width: 2.25; stroke-linejoin: round; stroke-linecap: round; }
.mb-svg-grafico .mb-svg-serie--tracejada { stroke-dasharray: 5 4; }
.mb-svg-grafico .mb-svg-ponto { fill: var(--superficie); stroke: var(--mb-serie, var(--texto)); stroke-width: 2; }
.mb-svg-grafico text { fill: var(--texto-sutil); font-family: var(--font-sans); font-size: 11px; font-variant-numeric: tabular-nums; }
.mb-svg-grafico .mb-svg-rotulo { fill: var(--texto); font-weight: 600; }

/* ---------- Funil de conversão: uma barra por etapa, nas cores do funil do módulo ---------- */
.mb-funil { display: grid; gap: 0; margin: 0; padding: 0; list-style: none; }
.mb-funil__etapa { display: grid; grid-template-columns: minmax(0, 140px) minmax(0, 1fr) 64px; align-items: center; gap: var(--esp-3); font-size: 13px; line-height: 18px; }
.mb-funil__barra { height: 26px; width: var(--v); min-width: 4px; background: var(--mb-serie, var(--texto)); border-radius: var(--raio-xs); }
.mb-funil__passagem { margin: 2px 0; padding-left: calc(140px + var(--esp-3) + var(--esp-2)); font-size: 11px; line-height: 16px; color: var(--texto-sutil); font-variant-numeric: tabular-nums; }
.mb-funil--vendas .mb-funil__etapa:nth-child(1) { --mb-serie: var(--etapa-vendas-contato); }
.mb-funil--vendas .mb-funil__etapa:nth-child(3) { --mb-serie: var(--etapa-vendas-agendada); }
.mb-funil--vendas .mb-funil__etapa:nth-child(5) { --mb-serie: var(--etapa-vendas-realizada); }
.mb-funil--vendas .mb-funil__etapa:nth-child(7) { --mb-serie: var(--etapa-vendas-proposta); }
.mb-funil--vendas .mb-funil__etapa:nth-child(9) { --mb-serie: var(--sucesso); }

/* ---------- Indicador clicável: o número abre a lista dele (no PainelLateral --larga) ---------- */
a.mb-indicador, button.mb-indicador { text-align: left; font: inherit; color: inherit; text-decoration: none; cursor: pointer; transition: border-color var(--mb-transicao), box-shadow var(--mov-cartao) var(--mov-curva), transform var(--mov-cartao) var(--mov-curva); }
@media (hover: hover) { :is(a, button).mb-indicador:not([aria-disabled="true"]):hover { border-color: var(--linha-forte); box-shadow: var(--sombra-elegante); transform: translateY(var(--mov-elevacao)); } }
.mb-indicador__abrir { font-size: 12px; line-height: 16px; font-weight: 600; color: var(--link); }
:is(a, button).mb-indicador[aria-disabled="true"] { cursor: default; }
:is(a, button).mb-indicador[aria-disabled="true"] .mb-indicador__abrir { display: none; }
.mb-relatorio__resumo { display: flex; flex-wrap: wrap; gap: var(--esp-6); }
.mb-relatorio__resumo dl { margin: 0; display: grid; gap: 0; }
.mb-relatorio__resumo dt { font-size: 11px; line-height: 16px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--texto-sutil); }
.mb-relatorio__resumo dd { margin: 0; font-family: var(--font-display); font-size: 20px; line-height: 26px; font-weight: 700; color: var(--texto); font-variant-numeric: tabular-nums; }
.mb-relatorio__origem { margin: 0; font-size: 12px; line-height: 16px; color: var(--texto-sutil); }

/* ---------- Meta com mínimo ---------- */
.mb-meta__minimo { position: absolute; top: -4px; bottom: -4px; width: 0; margin-left: -1px; border-left: 2px dashed var(--texto-suave); }
.mb-meta__marcos { position: relative; height: 16px; font-size: 11px; line-height: 16px; color: var(--texto-sutil); font-variant-numeric: tabular-nums; }
.mb-meta__marcos span { position: absolute; transform: translateX(-50%); white-space: nowrap; }

/* ---------- Formulário denso ---------- */
.mb-form-secao { display: grid; gap: var(--esp-4); }
.mb-form-secao + .mb-form-secao { padding-top: var(--esp-6); border-top: var(--mb-borda) solid var(--linha); }
.mb-form-secao__titulo { margin: 0; font-size: 11px; line-height: 16px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--texto-sutil); }
.mb-form-grade--3 > * { grid-column: span 4; }
@media (max-width: 1023px) { .mb-form-grade--3 > * { grid-column: span 6; } }
/* Calculado: o sistema escreve, ninguém digita (fundo plano e o "=" na frente) */
.mb-campo--calculado .mb-campo__afixo:first-child { font-family: var(--font-mono); }
/* Bloqueado pelo perfil: plano, com o cadeado e o motivo */
.mb-campo--bloqueado .mb-campo__rotulo::after { content: " · só leitura"; font-weight: 400; color: var(--texto-sutil); }
/* Linhas repetíveis (comissões, tipologias, valor por corretor) */
.mb-repetivel { display: grid; gap: var(--esp-2); margin: 0; padding: 0; list-style: none; }
.mb-repetivel__linha { display: grid; grid-template-columns: var(--mb-repetivel-colunas, minmax(0, 2fr) minmax(0, 1fr) minmax(0, 1fr)) auto; align-items: end; gap: var(--esp-3); }
.mb-repetivel__linha + .mb-repetivel__linha .mb-campo__rotulo { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.mb-repetivel__rodape { display: flex; align-items: center; justify-content: space-between; gap: var(--esp-3); padding-top: var(--esp-2); border-top: var(--mb-borda) solid var(--linha); font-size: 13px; line-height: 18px; color: var(--texto-suave); font-variant-numeric: tabular-nums; }
.mb-repetivel__rodape strong { color: var(--texto); }
@media (max-width: 767px) {
  .mb-repetivel__linha { grid-template-columns: minmax(0, 1fr) auto; padding: var(--esp-3); background: var(--superficie-sutil); border-radius: var(--raio-sm); }
  .mb-repetivel__linha > .mb-campo { grid-column: 1; }
  .mb-repetivel__linha > .mb-botao { grid-column: 2; grid-row: 1; }
  .mb-repetivel__linha + .mb-repetivel__linha .mb-campo__rotulo { position: static; width: auto; height: auto; clip: auto; }
}

/* ---------- Histórico (linha do tempo do registro) ---------- */
.mb-historico { display: grid; gap: 0; margin: 0; padding: 0; list-style: none; }
.mb-historico__item { position: relative; display: grid; gap: 2px; padding: 0 0 var(--esp-4) var(--esp-6); font-size: 13px; line-height: 18px; color: var(--texto-suave); }
.mb-historico__item::before { content: ""; position: absolute; left: 4px; top: 6px; width: 8px; height: 8px; border-radius: var(--raio-total); background: var(--superficie); box-shadow: 0 0 0 2px var(--texto-suave); }
.mb-historico__item::after { content: ""; position: absolute; left: 7px; top: 18px; bottom: 2px; width: 2px; background: var(--linha); }
.mb-historico__item:last-child::after { display: none; }
.mb-historico__item--auto::before { box-shadow: 0 0 0 2px var(--linha-forte); }
.mb-historico__cabeca { display: flex; flex-wrap: wrap; gap: 0 var(--esp-2); color: var(--texto-sutil); font-size: 12px; line-height: 18px; }
.mb-historico__cabeca strong { font-size: 13px; color: var(--texto); }
.mb-historico__texto { margin: 0; font-size: 14px; line-height: 20px; color: var(--texto); }
.mb-historico__item--auto .mb-historico__texto { color: var(--texto-suave); }
.mb-historico__depois { font-size: 12px; line-height: 16px; color: var(--texto-suave); }

/* ---------- Busca com sugestões (combobox) ---------- */
.mb-sugestoes-alvo { position: relative; }
.mb-sugestoes {
  position: absolute; left: 0; right: 0; top: calc(100% + var(--esp-1)); z-index: var(--camada-popup); max-height: 320px; overflow-y: auto; margin: 0; padding: var(--esp-1); list-style: none;
  background: var(--superficie); border: var(--mb-borda) solid var(--linha); border-radius: var(--raio-md); box-shadow: var(--sombra-flutuante);
}
.mb-sugestoes[hidden] { display: none; }
.mb-sugestoes__opcao { display: grid; gap: 0; padding: var(--esp-2) var(--esp-3); border-radius: var(--raio-sm); cursor: pointer; font-size: 14px; line-height: 20px; color: var(--texto); }
.mb-sugestoes__opcao small { font-size: 12px; line-height: 16px; color: var(--texto-sutil); }
.mb-sugestoes__opcao mark { background: none; color: inherit; font-weight: 700; }
.mb-sugestoes__opcao[aria-selected="true"], .mb-sugestoes__opcao:hover { background: var(--areia-suave); }
.mb-sugestoes__opcao--criar { margin-top: var(--esp-1); border-top: var(--mb-borda) solid var(--linha); border-radius: 0 0 var(--raio-sm) var(--raio-sm); font-weight: 600; }
.mb-sugestoes__vazio { padding: var(--esp-2) var(--esp-3); font-size: 13px; line-height: 18px; color: var(--texto-sutil); }
/* Ações dentro de um aviso (duplicado, importação) */
.mb-aviso__acoes { display: flex; flex-wrap: wrap; gap: var(--esp-2); margin-top: var(--esp-2); }

/* ---------- Confirmar na linha (tirar um item de uma lista) ---------- */
.mb-confirmar { display: flex; align-items: center; flex-wrap: wrap; gap: var(--esp-2) var(--esp-3); padding: var(--esp-2) var(--esp-3); border-radius: var(--raio-sm); background: var(--erro-fundo); font-size: 13px; line-height: 18px; color: var(--texto); }
.mb-confirmar[hidden] { display: none; }
.mb-confirmar__texto { flex: 1; min-width: 180px; }
.mb-confirmar__texto strong { color: var(--erro-texto); }

/* ---------- Mensagem pronta (WhatsApp) ---------- */
.mb-variaveis { display: flex; flex-wrap: wrap; gap: var(--esp-1); }
.mb-variavel { display: inline-flex; align-items: center; height: 24px; padding: 0 var(--esp-2); border-radius: var(--raio-xs); background: var(--superficie-sutil); border: var(--mb-borda) solid var(--linha); font-family: var(--font-mono); font-size: 11px; color: var(--texto-suave); cursor: pointer; }
.mb-variavel:hover { border-color: var(--linha-forte); color: var(--texto); }

/* ---------- Leva 2 na impressão ---------- */
@media print {
  .mb-lote, .mb-filtros, .mb-sugestoes, .mb-confirmar, .mb-tabela__marcar, .mb-tabela__ordenar::after { display: none !important; }
  .mb-barras__seg, .mb-colunas__barra, .mb-funil__barra, .mb-barras__neg, .mb-barras__pos { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
}

/* ---------- Movimento reduzido: sistema (prefers-reduced-motion) ou chave do usuário (data-movimento) ---------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
  .mb-lead:hover, .mb-item:hover, .mb-indicador:hover, .mb-botao:hover, .mb-botao:active, .mb-opcao:active { transform: none !important; }
}
html[data-movimento="reduzido"] *, html[data-movimento="reduzido"] *::before, html[data-movimento="reduzido"] *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
html[data-movimento="reduzido"] .mb-lead:hover, html[data-movimento="reduzido"] .mb-item:hover, html[data-movimento="reduzido"] .mb-botao:hover, html[data-movimento="reduzido"] .mb-botao:active, html[data-movimento="reduzido"] .mb-opcao:active { transform: none !important; }


/* ---------- Impressão: A4, legível em preto e branco ---------- */
@media print {
  @page { size: A4; margin: 12mm; }
  html, body { background: #ffffff !important; color: #000000 !important; font-size: 11pt; }
  *, *::before, *::after { box-shadow: none !important; }
  .mb-menu, .mb-barra-acoes, .mb-foco__barra, .mb-abas, .mb-botao, .mb-trilha,
  .mb-celular-topo, .mb-folha, .mb-folha__veu, .mb-toast, .mb-conexao, .mb-popup, .mb-dica { display: none !important; }
  .mb-app { display: block; }
  .mb-app__conteudo { max-width: none; padding: 0; }
  .mb-cartao, .mb-tabela-envoltorio, .mb-indicador { border-color: #000000; break-inside: avoid; }
  .mb-tabela th { background: none; color: #000000; border-bottom: 1.5pt solid #000000; position: static; }
  .mb-tabela td { border-bottom-color: #9a9a9a; }
  .mb-tabela tbody tr:nth-child(even) td { background: #efefef; }
  /* Selos e fases imprimem como texto com contorno: o significado está na palavra, não na cor */
  .mb-selo, .mb-selo-lead { background: none !important; color: #000000 !important; border: 1pt solid #000000; }
  .mb-selo-lead > [aria-hidden="true"] { color: #000000 !important; }
  .mb-selo::before, .mb-fase::before { background: #000000 !important; }
  .mb-aviso { background: none !important; border: 1pt solid #000000; }
  .mb-aviso__titulo, .mb-indicador__variacao { color: #000000 !important; }
  a { color: #000000; }
  .mb-secao { opacity: 1 !important; }
  .mb-subsecao { background: none !important; border-left: 1.5pt solid #000000; border-radius: 0; }
  .mb-tabela th { background: none !important; }
  .mb-esteira__seg { background: #c8c8c8 !important; }
  .mb-esteira__seg--feito, .mb-esteira__seg--atual { background: #000000 !important; }
  .mb-lead, :is(.mb-resumo, .mb-faixa), .mb-meta, .mb-visita { box-shadow: none !important; border: 1pt solid #000000; break-inside: avoid; }
  :is(.mb-resumo, .mb-faixa) { background: none !important; color: #000000 !important; }
  :is(.mb-resumo, .mb-faixa) * { color: #000000 !important; }
  .mb-meta__barra > span { background: #000000 !important; }
  .mb-entra { animation: none !important; opacity: 1 !important; transform: none !important; }
  .mb-etapa--atual .mb-etapa__marcador { background: #000000 !important; color: #ffffff !important; box-shadow: none !important; }
}

/* ---------- Aparência: preferências da pessoa (tela Minha conta) ---------- */
.mb-aparencia { display: grid; }
.mb-aparencia__linha { display: flex; align-items: center; justify-content: space-between; gap: var(--esp-4); padding: var(--esp-4) 0; border-top: var(--mb-borda) solid var(--linha); }
.mb-aparencia__linha:first-child { border-top: 0; padding-top: 0; }
.mb-aparencia__linha:last-child { padding-bottom: 0; }
.mb-aparencia__texto { display: grid; gap: 2px; min-width: 0; }
.mb-aparencia__rotulo { font-size: 14px; line-height: 20px; font-weight: 600; color: var(--texto); }
.mb-aparencia__ajuda { font-size: 12px; line-height: 16px; color: var(--texto-sutil); }
.mb-aparencia .mb-segmentado { flex: none; }
.mb-aparencia__padrao { font-size: 12px; line-height: 16px; color: var(--texto-sutil); }
@media (max-width: 767px) {
  .mb-aparencia__linha { flex-direction: column; align-items: stretch; gap: var(--esp-2); }
  .mb-aparencia .mb-segmentado { display: flex; }
  .mb-aparencia .mb-segmentado button { flex: 1; min-height: var(--controle-toque); }
}

/* ===================== Leva 3: estrutura, acesso e configuração ===================== */

/* ---------- Quadro (etapas em colunas; arrastar ou mover pelo teclado) ---------- */
.mb-quadro { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(232px, 1fr); gap: var(--esp-4); align-items: start; overflow-x: auto; padding-bottom: var(--esp-2); }
.mb-quadro__coluna {
  display: grid; gap: var(--esp-3); align-content: start; min-height: 320px; padding: var(--esp-2); margin: calc(-1 * var(--esp-2));
  border: var(--mb-borda) dashed transparent; border-radius: var(--raio-md);
  transition: background-color var(--mb-transicao), border-color var(--mb-transicao);
}
.mb-quadro__cabeca { display: flex; align-items: center; justify-content: space-between; gap: var(--esp-2); min-height: 28px; padding: 0 var(--esp-1); }
.mb-quadro__contagem { font-size: 13px; line-height: 18px; font-weight: 700; color: var(--texto); font-variant-numeric: tabular-nums; }
.mb-quadro__soma { font-size: 12px; line-height: 16px; color: var(--texto-sutil); font-variant-numeric: tabular-nums; }
.mb-quadro__cartoes { display: grid; gap: var(--esp-2); margin: 0; padding: 0; list-style: none; min-height: 120px; }
.mb-quadro .mb-item { padding: var(--esp-3) var(--esp-4); gap: var(--esp-1); cursor: grab; }
.mb-quadro .mb-item .mb-item__titulo { font-size: 15px; line-height: 20px; }
.mb-quadro .mb-item .mb-item__linha { font-size: 13px; line-height: 18px; }
.mb-quadro__vazio { display: grid; place-content: center; min-height: 96px; border: var(--mb-borda) dashed var(--linha-forte); border-radius: var(--raio-md); font-size: 12px; line-height: 16px; color: var(--texto-sutil); text-align: center; padding: var(--esp-3); }
/* Arrastando: o card de origem esmaece; a coluna sob o ponteiro ganha o fundo de seleção e o contorno tracejado */
.mb-quadro__vazio[hidden] { display: none; }
.mb-quadro .mb-item.mb-quadro__pegando { opacity: 0.45; transform: none; }
.mb-quadro__coluna--alvo { background: var(--areia-suave); border-color: var(--linha-forte); }
/* Pego pelo teclado (Espaço): contorno em tinta até soltar (Espaço) ou cancelar (Esc) */
.mb-quadro .mb-item[data-mb-pego] { outline: var(--mb-foco-espessura) solid var(--texto); outline-offset: var(--mb-foco-afastamento); box-shadow: var(--sombra-flutuante); cursor: grabbing; }
.mb-quadro__abas { display: none; }
@media (max-width: 767px) {
  .mb-quadro__abas { display: flex; margin-bottom: var(--esp-4); }
  .mb-quadro { display: block; overflow: visible; }
  .mb-quadro__coluna { display: none; margin: 0; padding: 0; min-height: 0; }
  .mb-quadro__coluna--ativa { display: grid; }
  .mb-quadro__coluna > .mb-quadro__cabeca { display: none; }
  .mb-quadro .mb-item { cursor: pointer; }
}

/* ---------- Notificações (popup do sino e página “Ver todas”) ---------- */
.mb-popup.mb-notificacoes { width: 380px; max-width: calc(100vw - 2 * var(--esp-4)); padding: 0; overflow: hidden; }
.mb-notificacoes__topo { display: flex; align-items: center; justify-content: space-between; gap: var(--esp-3); padding: var(--esp-2) var(--esp-2) var(--esp-2) var(--esp-4); border-bottom: var(--mb-borda) solid var(--linha); }
.mb-notificacoes__titulo { margin: 0; font-size: 14px; line-height: 20px; font-weight: 700; color: var(--texto); }
.mb-notificacoes__lista { max-height: 440px; overflow-y: auto; margin: 0; padding: var(--esp-1) 0; list-style: none; }
.mb-notificacoes__grupo { margin: 0; padding: var(--esp-3) var(--esp-4) var(--esp-1); font-size: 11px; line-height: 16px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--texto-sutil); }
.mb-notificacoes__rodape { display: flex; justify-content: center; padding: var(--esp-2); border-top: var(--mb-borda) solid var(--linha); background: var(--superficie-sutil); }
.mb-notificacao {
  position: relative; display: grid; grid-template-columns: 20px minmax(0, 1fr) 8px; gap: var(--esp-3); align-items: start;
  padding: var(--esp-3) var(--esp-4); color: var(--texto); text-decoration: none; transition: background-color var(--mb-transicao);
}
.mb-notificacao:hover { background: var(--areia-suave); }
.mb-notificacao > .mb-icone { margin-top: 1px; color: var(--texto-sutil); }
.mb-notificacao__texto { display: grid; gap: 2px; min-width: 0; }
.mb-notificacao__titulo { font-size: 13px; line-height: 18px; font-weight: 500; color: var(--texto-suave); }
.mb-notificacao__detalhe { font-size: 12px; line-height: 16px; color: var(--texto-sutil); font-variant-numeric: tabular-nums; }
.mb-notificacao__sinal { font-weight: 700; }
.mb-notificacao__sinal--acao { color: var(--erro-texto); }
.mb-notificacao__sinal--ok { color: var(--sucesso-texto); }
/* Não lida: título em tinta e negrito, e o ponto de notificação (marca), o mesmo do sino */
.mb-notificacao--nova .mb-notificacao__titulo { font-weight: 700; color: var(--texto); }
.mb-notificacao--nova::after { content: ""; grid-column: 3; width: 8px; height: 8px; margin-top: 5px; border-radius: var(--raio-total); background: var(--marca); }
.mb-notificacao--nova > .mb-icone { color: var(--texto); }
/* Na página “Ver todas”, dentro de um Cartao */
.mb-cartao .mb-notificacoes__lista { max-height: none; padding: 0; }
.mb-cartao .mb-notificacao { border-top: var(--mb-borda) solid var(--linha); }
.mb-cartao .mb-notificacoes__lista > li:first-child .mb-notificacao { border-top: 0; }
/* No celular o sino sai do topo: o ponto vai para o ícone de menu e “Notificações” entra na folha */
.mb-menu-icone .mb-botao__ponto { top: 9px; right: 7px; }
.mb-folha__contagem { margin-left: auto; min-width: 22px; height: 22px; padding: 0 6px; box-sizing: border-box; display: inline-grid; place-content: center; border-radius: var(--raio-total); background: var(--texto); color: var(--superficie); font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }

/* ---------- Atalhos de teclado ---------- */
.mb-atalhos { display: grid; gap: var(--esp-5); }
.mb-atalhos__grupo { display: grid; gap: var(--esp-1); margin: 0; }
.mb-atalhos__titulo { margin: 0 0 var(--esp-1); font-size: 11px; line-height: 16px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--texto-sutil); }
.mb-atalhos__linha { display: flex; align-items: center; justify-content: space-between; gap: var(--esp-4); min-height: 32px; border-bottom: var(--mb-borda) solid var(--linha); }
.mb-atalhos__linha:last-child { border-bottom: 0; }
.mb-atalhos__linha dt { font-size: 14px; line-height: 20px; color: var(--texto); }
.mb-atalhos__linha dd { margin: 0; display: inline-flex; align-items: center; gap: var(--esp-1); font-size: 12px; color: var(--texto-sutil); }
.mb-atalhos .mb-tecla { min-width: 24px; height: 24px; font-size: 12px; font-weight: 600; color: var(--texto); box-shadow: inset 0 -1px 0 var(--linha); }
.mb-dialogo--largo { max-width: 560px; }
.mb-dialogo__topo { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--esp-3); }

/* ---------- Entrar (e esqueci a senha, redefinir, convite) ---------- */
.mb-entrar { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: var(--esp-10) var(--esp-4); box-sizing: border-box; background: var(--fundo); }
.mb-entrar__caixa { display: grid; gap: var(--esp-6); width: 100%; max-width: 400px; }
.mb-entrar__marca { display: flex; justify-content: center; }
.mb-entrar__cartao { display: grid; gap: var(--esp-5); padding: var(--esp-8) var(--esp-6); background: var(--superficie); border: var(--mb-borda) solid var(--linha); border-radius: var(--raio-md); box-shadow: var(--sombra-cartao); }
.mb-entrar__cabeca { display: grid; gap: var(--esp-1); }
.mb-entrar__titulo { margin: 0; font-family: var(--font-display); font-size: 24px; line-height: 28px; font-weight: 700; letter-spacing: -0.02em; color: var(--texto); }
.mb-entrar__texto { margin: 0; font-size: 14px; line-height: 22px; color: var(--texto-suave); }
.mb-entrar__form { display: grid; gap: var(--esp-4); }
.mb-entrar__linha { display: flex; align-items: center; justify-content: space-between; gap: var(--esp-3); flex-wrap: wrap; font-size: 13px; line-height: 18px; }
.mb-entrar__rodape { display: flex; align-items: center; justify-content: space-between; gap: var(--esp-3); flex-wrap: wrap; font-size: 12px; line-height: 16px; color: var(--texto-sutil); }
.mb-entrar__convite { display: flex; align-items: center; gap: var(--esp-3); padding: var(--esp-3); border-radius: var(--raio-sm); background: var(--superficie-sutil); font-size: 13px; line-height: 18px; color: var(--texto-suave); }
.mb-entrar__convite strong { color: var(--texto); }
/* Campo de senha com “Mostrar” dentro do mesmo campo arredondado */
.mb-campo__mostrar {
  flex: none; display: inline-flex; align-items: center; padding: 0 var(--esp-3); border: 0; border-left: var(--mb-borda) solid var(--linha);
  background: none; color: var(--texto-suave); font-family: var(--font-sans); font-size: 13px; line-height: 18px; font-weight: 600; cursor: pointer;
}
.mb-campo__mostrar:hover { color: var(--texto); background: var(--areia-suave); }
.mb-campo__mostrar:focus-visible { outline-offset: -3px; }
/* Requisitos da senha: cada linha com sinal e palavra; “–” falta, “✓” cumpriu */
.mb-requisitos { display: grid; gap: 2px; margin: 0; padding: 0; list-style: none; font-size: 12px; line-height: 18px; color: var(--texto-sutil); }
.mb-requisitos li::before { content: "–"; display: inline-block; width: 16px; font-weight: 700; }
.mb-requisitos li[data-ok] { color: var(--sucesso-texto); }
.mb-requisitos li[data-ok]::before { content: "✓"; }
@media (max-width: 767px) {
  .mb-entrar { align-items: start; padding-top: var(--esp-8); }
  .mb-entrar__cartao { padding: var(--esp-6) var(--esp-5); }
}

/* ---------- Estados de página (sem permissão, não encontrado, conta, erro de carga, em construção) ---------- */
.mb-estado { display: grid; justify-items: center; gap: var(--esp-3); max-width: 480px; margin: var(--esp-16) auto; padding: 0 var(--esp-4); text-align: center; }
.mb-estado__icone { display: grid; place-content: center; width: 56px; height: 56px; margin-bottom: var(--esp-2); border-radius: var(--raio-total); background: var(--areia); color: var(--texto-suave); }
.mb-estado__icone .mb-icone { width: 24px; height: 24px; }
.mb-estado--erro .mb-estado__icone { background: var(--erro-fundo); color: var(--erro-texto); }
.mb-estado--alerta .mb-estado__icone { background: var(--alerta-fundo); color: var(--alerta-texto); }
.mb-estado--info .mb-estado__icone { background: var(--info-fundo); color: var(--info-texto); }
.mb-estado__sobrelinha { font-size: 11px; line-height: 16px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--texto-sutil); }
.mb-estado__titulo { margin: 0; font-family: var(--font-display); font-size: 22px; line-height: 28px; font-weight: 700; letter-spacing: -0.02em; color: var(--texto); }
.mb-estado__texto { margin: 0; font-size: 14px; line-height: 22px; color: var(--texto-suave); }
.mb-estado__acoes { display: flex; justify-content: center; gap: var(--esp-2); flex-wrap: wrap; margin-top: var(--esp-2); }
.mb-estado__detalhe { font-size: 12px; line-height: 16px; color: var(--texto-sutil); }
.mb-estado--compacto { margin: var(--esp-8) auto; }
@media (max-width: 767px) {
  .mb-estado { margin: var(--esp-10) auto; }
  .mb-estado__acoes { width: 100%; flex-direction: column; }
  .mb-estado__acoes > .mb-botao { width: 100%; }
}

/* ---------- Minha conta (página de ajustes com índice lateral) ---------- */
.mb-ajustes { display: grid; grid-template-columns: 200px minmax(0, var(--leitura-max)); gap: var(--esp-8); align-items: start; }
.mb-ajustes__indice { position: sticky; top: calc(var(--topo-altura) + var(--esp-4)); display: grid; gap: 2px; margin: 0; padding: 0; list-style: none; }
.mb-ajustes__indice a { display: flex; align-items: center; min-height: 32px; padding: 0 var(--esp-3); border-radius: var(--raio-sm); font-size: 13px; line-height: 18px; font-weight: 600; color: var(--texto-suave); text-decoration: none; }
.mb-ajustes__indice a:hover { background: var(--areia-suave); color: var(--texto); }
.mb-ajustes__indice a[aria-current="true"] { background: var(--areia); color: var(--texto); }
.mb-ajustes__secoes { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--esp-6); min-width: 0; }
.mb-ajustes__secoes > .mb-cartao { scroll-margin-top: calc(var(--topo-altura) + var(--esp-4)); }
.mb-ajuste { display: flex; align-items: center; justify-content: space-between; gap: var(--esp-4); padding: var(--esp-4) 0; border-top: var(--mb-borda) solid var(--linha); }
.mb-ajuste:first-child { border-top: 0; padding-top: 0; }
.mb-ajuste:last-child { padding-bottom: 0; }
.mb-ajuste__texto { display: grid; gap: 2px; min-width: 0; }
.mb-ajuste__rotulo { font-size: 14px; line-height: 20px; font-weight: 600; color: var(--texto); }
.mb-ajuste__ajuda { font-size: 12px; line-height: 16px; color: var(--texto-sutil); }
.mb-ajuste > .mb-interruptor, .mb-ajuste > .mb-botao { flex: none; }
.mb-passos-instalar { display: grid; gap: var(--esp-2); margin: 0; padding-left: var(--esp-5); font-size: 13px; line-height: 20px; color: var(--texto-suave); }
@media (max-width: 1023px) {
  .mb-ajustes { grid-template-columns: minmax(0, 1fr); }
  .mb-ajustes__indice { display: none; }
}
@media (max-width: 767px) {
  /* Rodapé de cartão no celular: duas ações curtas dividem a linha; as longas empilham */
  .mb-cartao__rodape { flex-wrap: wrap; }
  .mb-cartao__rodape > .mb-botao { flex: 1 1 auto; }
  .mb-ajuste { flex-direction: column; align-items: stretch; gap: var(--esp-2); }
  .mb-ajuste > .mb-interruptor { justify-content: space-between; }
}

/* ---------- Assistente em passos ---------- */
.mb-assistente { display: grid; gap: var(--esp-6); max-width: var(--leitura-max); margin: 0 auto; padding: var(--esp-6) var(--esp-6) 0; box-sizing: border-box; }
.mb-assistente__passo { display: none; font-size: 13px; line-height: 18px; font-weight: 600; color: var(--texto-suave); }
.mb-assistente__passo strong { color: var(--texto); }
.mb-assistente__trilho { display: none; height: 4px; border-radius: var(--raio-total); background: var(--trilho); overflow: hidden; }
.mb-assistente__trilho > span { display: block; height: 100%; background: var(--texto); }
.mb-revisao { display: grid; }
.mb-revisao__secao { display: grid; gap: var(--esp-2); padding: var(--esp-4) 0; border-top: var(--mb-borda) solid var(--linha); }
.mb-revisao__secao:first-child { border-top: 0; padding-top: 0; }
.mb-revisao__cabeca { display: flex; align-items: center; justify-content: space-between; gap: var(--esp-3); }
.mb-revisao__titulo { margin: 0; font-size: 14px; line-height: 20px; font-weight: 700; color: var(--texto); }
@media (max-width: 767px) {
  .mb-assistente { padding: var(--esp-4) var(--esp-4) 0; gap: var(--esp-4); }
  .mb-assistente > .mb-etapas { display: none; }
  .mb-assistente__passo { display: block; }
  .mb-assistente__trilho { display: block; }
}

/* ---------- Espelho de unidades ---------- */
.mb-espelho { display: grid; gap: var(--esp-4); }
.mb-espelho__resumo { display: flex; align-items: center; justify-content: space-between; gap: var(--esp-3); flex-wrap: wrap; font-size: 13px; line-height: 18px; color: var(--texto-suave); }
.mb-espelho__quadro { overflow: auto; background: var(--superficie); border: var(--mb-borda) solid var(--linha); border-radius: var(--raio-md); box-shadow: var(--sombra-cartao); }
.mb-espelho__grade {
  --mb-finais: 4;
  display: grid; grid-template-columns: 48px repeat(var(--mb-finais), minmax(84px, 1fr)); gap: var(--esp-1);
  min-width: max-content; padding: var(--esp-3) var(--esp-4) var(--esp-4); margin: 0;
}
.mb-espelho__final, .mb-espelho__andar { font-size: 11px; line-height: 16px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--texto-sutil); font-variant-numeric: tabular-nums; }
.mb-espelho__final { padding: 0 var(--esp-2) var(--esp-1); }
.mb-espelho__andar { position: sticky; left: 0; z-index: var(--camada-conteudo); display: flex; align-items: center; margin-left: calc(-1 * var(--esp-4)); padding-left: var(--esp-4); background: var(--superficie); letter-spacing: 0; text-transform: none; }
/* Cada unidade: número em código e o estado escrito; a cor reforça, nunca decide */
.mb-espelho__unidade {
  --mb-espelho-fundo: var(--sucesso-fundo); --mb-espelho-texto: var(--sucesso-texto);
  display: grid; align-content: center; gap: 0; min-height: 52px; padding: var(--esp-1) var(--esp-2); box-sizing: border-box;
  border: var(--mb-borda) solid transparent; border-radius: var(--raio-sm); background: var(--mb-espelho-fundo); color: var(--mb-espelho-texto);
  font-family: var(--font-sans); text-align: left; cursor: pointer;
  transition: border-color var(--mb-transicao), opacity var(--mb-transicao), box-shadow var(--mb-transicao);
}
.mb-espelho__unidade:hover { border-color: currentColor; }
.mb-espelho__numero { font-family: var(--font-mono); font-size: 13px; line-height: 18px; font-weight: 600; color: var(--texto); }
.mb-espelho__estado { font-size: 11px; line-height: 14px; font-weight: 600; }
.mb-espelho__unidade--disponivel { --mb-espelho-fundo: var(--sucesso-fundo); --mb-espelho-texto: var(--sucesso-texto); }
.mb-espelho__unidade--reservada { --mb-espelho-fundo: var(--info-fundo); --mb-espelho-texto: var(--info-texto); }
.mb-espelho__unidade--alugada { --mb-espelho-fundo: var(--alerta-fundo); --mb-espelho-texto: var(--alerta-texto); }
.mb-espelho__unidade--vendida { --mb-espelho-fundo: var(--espelho-vendida-fundo); --mb-espelho-texto: var(--espelho-vendida-texto); }
.mb-espelho__unidade--fora {
  --mb-espelho-fundo: var(--superficie-sutil); --mb-espelho-texto: var(--texto-sutil);
  background-image: repeating-linear-gradient(135deg, transparent 0 6px, var(--linha) 6px 7px); border-color: var(--linha);
}
.mb-espelho__unidade--fora .mb-espelho__numero { color: var(--texto-suave); }
.mb-espelho__unidade[aria-pressed="true"] { border-color: var(--texto); box-shadow: 0 0 0 1px var(--texto); }
.mb-espelho__unidade--apagada { opacity: 0.28; }
.mb-espelho__unidade--apagada:hover { opacity: 0.6; }
.mb-espelho__vazio { min-height: 52px; }
/* Selo da unidade vendida no painel (as outras usam os selos de status: sucesso, info, alerta e o neutro) */
.mb-selo--vendida { background: var(--espelho-vendida-fundo); color: var(--espelho-vendida-texto); --mb-selo-ponto: var(--espelho-vendida); }
/* Amostra do estado nas pílulas de filtro e na legenda */
.mb-amostra { display: inline-block; flex: none; width: 10px; height: 10px; border-radius: 2px; background: var(--sucesso); }
.mb-amostra--disponivel { background: var(--sucesso); }
.mb-amostra--reservada { background: var(--info); }
.mb-amostra--alugada { background: var(--alerta); }
.mb-amostra--vendida { background: var(--espelho-vendida); }
.mb-amostra--fora { background: repeating-linear-gradient(135deg, var(--superficie) 0 2px, var(--texto-sutil) 2px 3px); box-shadow: inset 0 0 0 1px var(--texto-sutil); }
.mb-espelho .mb-opcao .mb-amostra { margin-right: 2px; }
.mb-espelho .mb-opcao .mb-num { font-weight: 700; }
@media (max-width: 767px) {
  .mb-espelho__grade { grid-template-columns: 40px repeat(var(--mb-finais), minmax(80px, 1fr)); padding: var(--esp-3); }
  .mb-espelho__andar { margin-left: calc(-1 * var(--esp-3)); padding-left: var(--esp-3); }
  .mb-espelho__unidade { min-height: var(--controle-toque); }
}

/* ---------- Card de empreendimento (CardDeItem com fase e estoque) ---------- */
.mb-estoque { display: grid; gap: var(--esp-2); }
.mb-estoque__barra { display: flex; gap: 2px; height: 8px; border-radius: var(--raio-total); overflow: hidden; background: var(--trilho); }
.mb-estoque__barra > span { display: block; height: 100%; min-width: 3px; }
.mb-estoque__seg--disponivel { background: var(--sucesso); }
.mb-estoque__seg--reservada { background: var(--info); }
.mb-estoque__seg--alugada { background: var(--alerta); }
.mb-estoque__seg--vendida { background: var(--espelho-vendida); }
.mb-estoque__seg--fora { background: var(--linha-forte); }
.mb-estoque__legenda { display: flex; flex-wrap: wrap; gap: var(--esp-1) var(--esp-3); margin: 0; padding: 0; list-style: none; font-size: 12px; line-height: 16px; color: var(--texto-suave); font-variant-numeric: tabular-nums; }
.mb-estoque__legenda li { display: inline-flex; align-items: center; gap: 6px; }
.mb-estoque__legenda strong { color: var(--texto); }
.mb-empreendimentos { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: var(--esp-4); margin: 0; padding: 0; list-style: none; }
.mb-empreendimentos > .mb-item { display: flex; flex-direction: column; }
.mb-empreendimentos > .mb-item > .mb-item__faixa { margin-top: auto; }
.mb-empreendimento__imagem { display: block; margin: calc(-1 * var(--esp-4)) calc(-1 * var(--esp-5)) var(--esp-2); aspect-ratio: 16 / 9; object-fit: cover; border-radius: calc(var(--raio-md) - var(--mb-borda)) calc(var(--raio-md) - var(--mb-borda)) 0 0; background: var(--areia); }

/* ---------- Construtor de condições (relatórios do Repasse, Direcionador do Marketing) ---------- */
.mb-condicoes { display: grid; gap: var(--esp-2); }
.mb-condicoes__modo { display: flex; align-items: center; gap: var(--esp-2); flex-wrap: wrap; font-size: 14px; line-height: 20px; color: var(--texto); }
.mb-condicoes__modo .mb-campo__entrada { width: auto; }
.mb-condicao { display: grid; grid-template-columns: 40px minmax(0, 1.2fr) minmax(0, 1fr) minmax(0, 1.4fr) auto; gap: var(--esp-2); align-items: center; }
.mb-condicao__conector { font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--texto-sutil); text-align: right; }
.mb-condicoes__acoes { display: flex; gap: var(--esp-2); flex-wrap: wrap; padding-left: calc(40px + var(--esp-2)); }
.mb-condicoes__bloco { display: grid; gap: var(--esp-3); padding: var(--esp-4); border-radius: var(--raio-sm); background: var(--superficie-sutil); }
.mb-condicoes__rotulo { font-size: 11px; line-height: 16px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--texto-sutil); }
.mb-condicoes__frase { margin: 0; padding-left: var(--esp-3); border-left: 2px solid var(--linha-forte); font-size: 14px; line-height: 22px; color: var(--texto); }
.mb-condicoes__frase em { font-style: normal; font-weight: 700; }
.mb-condicoes__resultado { display: flex; align-items: center; justify-content: space-between; gap: var(--esp-3); flex-wrap: wrap; font-size: 13px; line-height: 18px; color: var(--texto-suave); font-variant-numeric: tabular-nums; }
.mb-condicoes__resultado strong { color: var(--texto); }
@media (max-width: 767px) {
  /* Dentro do cartão, nada de caixa com borda: cada condição vira uma subseção (fundo sutil; dentro do bloco do Direcionador, a superfície) */
  .mb-condicao { grid-template-columns: minmax(0, 1fr) auto; padding: var(--esp-3); border-radius: var(--raio-sm); background: var(--superficie-sutil); }
  .mb-condicoes__bloco .mb-condicao { background: var(--superficie); }
  .mb-condicao__conector { grid-column: 1; text-align: left; }
  .mb-condicao > :not(.mb-condicao__conector):not(.mb-botao) { grid-column: 1 / -1; }
  .mb-condicao > .mb-botao { grid-column: 2; grid-row: 1; }
  .mb-condicoes__acoes { padding-left: 0; }
  .mb-condicoes__acoes > .mb-botao { flex: 1; }
}

/* ---------- Matriz de permissões ---------- */
.mb-matriz td, .mb-matriz th { text-align: center; }
.mb-matriz th:first-child, .mb-matriz td:first-child { text-align: left; }
.mb-matriz td:first-child { min-width: 240px; }
.mb-matriz__acao { display: grid; gap: 2px; padding: var(--esp-2) 0; }
.mb-matriz__acao span { font-size: 12px; line-height: 16px; color: var(--texto-sutil); }
.mb-matriz__grupo th { box-shadow: none !important; height: auto; padding-top: var(--esp-4); padding-bottom: var(--esp-1); background: var(--superficie); border-bottom: var(--mb-borda) solid var(--linha); position: static; text-align: left; }
.mb-matriz .mb-marcador { justify-content: center; }
.mb-matriz select { height: var(--controle-p); padding: 0 var(--esp-6) 0 var(--esp-2); font-size: 13px; }
.mb-matriz td.mb-matriz__mudou { background: var(--areia); box-shadow: inset 0 0 0 1px var(--texto); }
.mb-matriz td.mb-matriz__fixo { color: var(--texto-sutil); font-size: 12px; }
.mb-matriz__perfil { display: grid; gap: 2px; justify-items: center; }
.mb-matriz__perfil span { font-size: 11px; font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--texto-sutil); }
.mb-permissoes-celular { display: grid; }
.mb-permissoes-celular .mb-ajuste { padding: var(--esp-3) 0; }

/* ---------- Lista editável de opções (catálogos) ---------- */
.mb-catalogo { margin: 0; padding: 0; list-style: none; }
.mb-catalogo__item {
  display: grid; grid-template-columns: 20px minmax(0, 1fr) auto auto auto; gap: var(--esp-3); align-items: center;
  min-height: 52px; padding: var(--esp-1) 0; border-top: var(--mb-borda) solid var(--linha);
}
.mb-catalogo__item:first-child { border-top: 0; }
.mb-catalogo__alca { display: grid; place-content: center; width: 20px; height: 32px; color: var(--texto-sutil); cursor: grab; }
.mb-catalogo__nome { display: flex; align-items: center; gap: var(--esp-2); min-width: 0; }
