.mb-catalogo__nome .mb-campo__entrada { height: var(--controle-p); font-size: 14px; font-weight: 600; border-color: transparent; box-shadow: none; background: transparent; padding: 0 var(--esp-2); margin-left: calc(-1 * var(--esp-2)); }
.mb-catalogo__nome .mb-campo__entrada:hover { border-color: var(--linha-forte); background: var(--campo); }
.mb-catalogo__nome .mb-campo__entrada:focus { background: var(--campo); }
.mb-catalogo__uso { font-size: 12px; line-height: 16px; color: var(--texto-sutil); white-space: nowrap; font-variant-numeric: tabular-nums; }
.mb-catalogo__ordem { display: inline-flex; gap: 2px; }
.mb-catalogo__item--inativa .mb-catalogo__nome .mb-campo__entrada { color: var(--texto-sutil); }
.mb-catalogo__item--nova { grid-template-columns: 20px minmax(0, 1fr) auto; }
.mb-catalogo__item--nova .mb-campo__entrada { height: var(--controle-p); }
.mb-catalogo__item .mb-interruptor { min-height: var(--controle-p); font-size: 12px; color: var(--texto-suave); }
.mb-catalogo__item.mb-quadro__pegando { opacity: 0.45; }
@media (max-width: 767px) {
  .mb-catalogo__item { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "nome ordem" "uso ativa"; gap: var(--esp-1) var(--esp-3); padding: var(--esp-3) 0; }
  .mb-catalogo__alca { display: none; }
  .mb-catalogo__nome { grid-area: nome; }
  .mb-catalogo__uso { grid-area: uso; }
  .mb-catalogo__item > .mb-interruptor { grid-area: ativa; min-height: var(--controle-toque); }
  .mb-catalogo__ordem { grid-area: ordem; }
  .mb-catalogo__item--nova { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: none; }
}

/* ---------- Modo telão (Dashboard numa TV: letras grandes, abas em rodízio) ---------- */
.mb-telao { display: grid; grid-template-rows: auto auto 1fr; gap: var(--esp-6); min-height: 100vh; min-height: 100dvh; padding: var(--esp-8) var(--esp-10); box-sizing: border-box; background: var(--fundo); color: var(--texto); }
.mb-telao__topo { display: flex; align-items: center; justify-content: space-between; gap: var(--esp-6); }
.mb-telao__titulo { display: flex; align-items: center; gap: var(--esp-5); }
.mb-telao__titulo h1 { margin: 0; font-family: var(--font-display); font-size: 32px; line-height: 36px; font-weight: 700; letter-spacing: -0.02em; }
.mb-telao__controles { display: flex; align-items: center; gap: var(--esp-2); }
.mb-telao .mb-ao-vivo { font-size: 16px; line-height: 22px; }
.mb-telao .mb-ao-vivo__ponto { width: 10px; height: 10px; }
.mb-telao__abas { display: flex; gap: var(--esp-8); border-bottom: var(--mb-borda) solid var(--linha); }
.mb-telao__aba { position: relative; height: 52px; padding: 0; border: 0; background: none; color: var(--texto-sutil); font-family: var(--font-sans); font-size: 20px; line-height: 28px; font-weight: 600; cursor: pointer; }
.mb-telao__aba[aria-selected="true"] { color: var(--texto); }
.mb-telao__aba::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 3px; background: var(--linha); opacity: 0; }
.mb-telao__aba[aria-selected="true"]::after { opacity: 1; }
/* A barra do tempo enche em 60 s embaixo da aba atual; pausada, ela para onde está */
.mb-telao__tempo { position: absolute; left: 0; bottom: -1px; z-index: var(--camada-conteudo); height: 3px; width: 100%; background: var(--texto); transform-origin: left center; transform: scaleX(0); }
.mb-telao__aba[aria-selected="true"] .mb-telao__tempo { animation: mb-telao-tempo var(--mb-telao-intervalo, 60s) linear forwards; }
.mb-telao--pausado .mb-telao__tempo { animation-play-state: paused !important; }
@keyframes mb-telao-tempo { to { transform: scaleX(1); } }
.mb-telao__corpo { display: grid; gap: var(--esp-6); align-content: start; }
.mb-telao .mb-indicadores { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--esp-5); }
.mb-telao .mb-indicador { padding: var(--esp-6); gap: var(--esp-2); }
.mb-telao .mb-indicador__rotulo { font-size: 14px; line-height: 20px; }
.mb-telao .mb-indicador__valor { font-size: 56px; line-height: 60px; }
.mb-telao .mb-indicador__meta, .mb-telao .mb-indicador__variacao { font-size: 16px; line-height: 22px; }
.mb-telao .mb-ranking__item { min-height: 72px; font-size: 22px; line-height: 28px; padding: var(--esp-3) var(--esp-6); grid-template-columns: 48px minmax(0, 1fr) auto; }
.mb-telao .mb-ranking__posicao { font-size: 20px; }
.mb-telao .mb-ranking__detalhe { font-size: 15px; line-height: 20px; }
.mb-telao__rodape { font-size: 14px; line-height: 20px; color: var(--texto-sutil); }
@media (prefers-reduced-motion: reduce) { .mb-telao__tempo { display: none; } }

      }

        } else if (tecla === 'ArrowUp' || tecla === 'ArrowDown') {
          evento.preventDefault();
          if (tecla === 'ArrowUp' && card.previousElementSibling) { lista.insertBefore(card, card.previousElementSibling); }
          if (tecla === 'ArrowDown' && card.nextElementSibling) { lista.insertBefore(card.nextElementSibling, card); }
          alvo.focus(); falar(descrever(card));
        } else if (tecla === ' ') {

          var destino = card.closest('.mb-quadro__coluna'), depois = card.nextElementSibling;

        } else if (tecla === TECLA_ESCAPE) {
          evento.preventDefault(); card.removeAttribute('data-mb-pego'); pego = null;
          origemTeclado.coluna.querySelector('.mb-quadro__cartoes').insertBefore(card, origemTeclado.depois); contar(); alvo.focus();
          falar('Movimento cancelado. ' + nomeDoCard(card) + ' continua em ' + nomeDaEtapa(origemTeclado.coluna) + '.');
        }

      /* Celular: uma coluna por vez, escolhida nas abas */
      var abasQuadro = raiz.querySelector('.mb-quadro__abas');

        if (abasQuadro) { todos(abasQuadro, '[data-etapa]').forEach(function (b) { b.setAttribute('aria-selected', String(b.getAttribute('data-etapa') === etapa)); }); }

        var inicial = abasQuadro.querySelector('[aria-selected="true"]') || abasQuadro.querySelector('[data-etapa]');

    }
