<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Base360</title>
<!-- Reserva, caso o servidor ignore o .htaccess: leva /crm/ para https://base360.mbigucci.com.br/vendas/.
     O script mantém o resto do caminho e a consulta; sem script, o meta refresh vai para o início. -->
<script>
  location.replace("https://base360.mbigucci.com.br" + location.pathname.replace(/^\/crm(\/|$)/, "/vendas/") + location.search + location.hash);
</script>
<meta http-equiv="refresh" content="0; url=https://base360.mbigucci.com.br/vendas/">
<style>
  body { margin: 0; padding: 48px 16px; background: #f7f6f2; color: #0d0e11; font: 15px/1.5 Inter, system-ui, sans-serif; }
  @media (prefers-color-scheme: dark) { body { background: #151619; color: #f5f3ed; } a { color: #ff6b70; } }
  a { color: #e11119; font-weight: 600; }
</style>
</head>
<body>
